name: Ölçü Defteri APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Projeyi çıkart
        run: |
          unzip -q -o OlcuDefteri-Pro-FINAL-v12-WELCOME.zip -d .
          echo "Proje dosyalari:"
          ls -la

      - name: Supabase ayarlarını ekle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY" || exit 1; python3 -c 'import json,os; p="app/src/main/assets/config.json"; d=json.load(open(p,encoding="utf-8")); d["supabaseUrl"]=os.environ["SUPABASE_URL"]; d["supabaseAnonKey"]=os.environ["SUPABASE_PUBLISHABLE_KEY"]; d["redirectUri"]="olcudefteri://auth-callback"; json.dump(d,open(p,"w",encoding="utf-8"),ensure_ascii=False,indent=2)'

            - name: Gradle 8.13 kur
              run: |
                wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
                unzip -q gradle-8.13-bin.zip

      - name: APK oluştur
        run: |
       ./gradle-8.13/bin/gradle assembleDebug --no-daemon

      - name: APK'yı hazırla
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-APK-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
