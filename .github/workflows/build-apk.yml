name: Ölçü Defteri APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Düzeltilmiş projeyi çıkart
        run: |
          ZIP="OlcuDefteri-Pro-v2.0.8-EMAIL-AUTH-FIX.zip"
          test -f "$ZIP" || { echo "FIXED ZIP bulunamadi"; exit 1; }
          unzip -q -o "$ZIP" -d .

      - name: Supabase ayarlarını ekle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || exit 1
          test -n "$SUPABASE_PUBLISHABLE_KEY" || exit 1
          python3 - <<'PY'
          import json, os
          p="app/src/main/assets/config.json"
          d=json.load(open(p,encoding="utf-8"))
          d["supabaseUrl"]=os.environ["SUPABASE_URL"]
          d["supabaseAnonKey"]=os.environ["SUPABASE_PUBLISHABLE_KEY"]
          d["redirectUri"]="olcudefteri://auth-callback"
          json.dump(d,open(p,"w",encoding="utf-8"),ensure_ascii=False,indent=2)
          PY

      - name: Sürümü doğrula
        run: |
          grep -q "versionCode 28" app/build.gradle
          grep -q 'versionName "2.0.8"' app/build.gradle

      - name: Gradle 8.13 kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip

      - name: APK oluştur
        run: |
          ./gradle-8.13/bin/gradle assembleDebug --no-daemon

      - name: APK'yı hazırla
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-APK-v2.0.8
          path: app/build/outputs/apk/debug/app-debug.apk
