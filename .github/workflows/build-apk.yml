name: Olcu Defteri 2.7.7 - APK ve AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olcu-defteri-android-build
  cancel-in-progress: false

jobs:
  build:
    name: APK ve AAB derle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_PROJECT_DIR: extracted

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
            echo "HATA: sdkmanager bulunamadı. SDK kökü: $sdk_root"
            find "$sdk_root" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          "$sdkmanager" --sdk_root="$sdk_root" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Kaynak projeyi bul ve sürümü doğrula
        id: project_root
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$GITHUB_WORKSPACE/$ANDROID_PROJECT_DIR"
          app_gradle=""
          if [[ -f "$project_dir/app/build.gradle" ]]; then
            app_gradle="$project_dir/app/build.gradle"
          else
            app_gradle="$(find "$GITHUB_WORKSPACE" -type f -path '*/app/build.gradle' -not -path '*/.git/*' -print -quit)"
          fi
          if [[ -z "$app_gradle" ]]; then
            archive_dir="$GITHUB_WORKSPACE/android-build-source"
            for archive in "$GITHUB_WORKSPACE"/OlcuDefteri-v2.7.6-*.zip; do
              [[ -f "$archive" ]] || continue
              rm -rf "$archive_dir"
              mkdir -p "$archive_dir"
              echo "Kaynak arşivi açılıyor: $(basename "$archive")"
              unzip -q "$archive" -d "$archive_dir"
              candidate="$(find "$archive_dir" -type f -path '*/app/build.gradle' -print -quit)"
              if [[ -n "$candidate" ]] && grep -Eq 'versionCode[[:space:]]+61' "$candidate" && grep -Eq 'versionName[[:space:]]+"2\.7\.7"' "$candidate"; then
                app_gradle="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$app_gradle" ]]; then
            echo 'HATA: versionCode 61 / versionName 2.7.7 içeren kaynak proje bulunamadı.'
            find "$GITHUB_WORKSPACE" -maxdepth 5 \( -name '*.zip' -o -name build.gradle -o -name settings.gradle \) -print
            exit 1
          fi
          project_dir="${app_gradle%/app/build.gradle}"
          if [[ ! -f "$project_dir/settings.gradle" && ! -f "$project_dir/settings.gradle.kts" ]]; then
            echo "Uyarı: $project_dir içinde settings.gradle yok; Android proje ayarları oluşturuluyor."
            cat > "$project_dir/settings.gradle" <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='OlcuDefteri'
          include ':app'
          GRADLE
          fi
          grep -Eq 'versionCode[[:space:]]+61' "$project_dir/app/build.gradle" || { echo 'HATA: versionCode 61 bulunamadı.'; exit 1; }
          grep -Eq 'versionName[[:space:]]+"2\.7\.7"' "$project_dir/app/build.gradle" || { echo 'HATA: versionName 2.7.7 bulunamadı.'; exit 1; }
          project_dir_rel="${project_dir#"$GITHUB_WORKSPACE"/}"
          printf 'ANDROID_PROJECT_DIR=%s\n' "$project_dir_rel" >> "$GITHUB_ENV"
          printf 'project_dir=%s\n' "$project_dir_rel" >> "$GITHUB_OUTPUT"
          python3 - "$project_dir/app/src/main/assets/config.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          cfg = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          required = ('supabaseUrl', 'supabaseAnonKey', 'redirectUri')
          missing = [key for key in required if not cfg.get(key)]
          if missing:
              raise SystemExit('config.json eksik alanlar: ' + ', '.join(missing))
          PY
      - name: İmzalama anahtarını hazırla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?ANDROID_KEYSTORE_BASE64 GitHub Actions secret eksik}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/olcudefteri-release.jks"
          test -s "$GITHUB_WORKSPACE/olcudefteri-release.jks"

      - name: Gradle 9.1.0 kur
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip \
            --output "$RUNNER_TEMP/gradle-9.1.0-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-9.1.0-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"

      - name: APK ve AAB oluştur
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret eksik}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret eksik}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret eksik}"
          gradle --version
          gradle --no-daemon --stacktrace -p "$GITHUB_WORKSPACE/$ANDROID_PROJECT_DIR" clean assembleRelease bundleRelease

      - name: APK ve AAB dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.7.7-release
          path: |
            ${{ steps.project_root.outputs.project_dir }}/app/build/outputs/apk/release/app-release.apk
            ${{ steps.project_root.outputs.project_dir }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
