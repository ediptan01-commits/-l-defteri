name: Olcu Defteri 2.7.6 - APK ve AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olcu-defteri-android-build
  cancel-in-progress: false

jobs:
  build:
    name: APK ve AAB derle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadı."
            echo "ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
      

      - name: Proje dosyalarını kontrol et
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build.gradle
          test -f settings.gradle
          test -f build.gradle
          test -f gradlew

          chmod +x gradlew

          grep -Eq 'versionCode[[:space:]]+60' app/build.gradle || {
            echo "HATA: app/build.gradle içinde versionCode 60 bulunamadı."
            exit 1
          }

          grep -Eq 'versionName[[:space:]]+"2\.7\.6"' app/build.gradle || {
            echo "HATA: app/build.gradle içinde versionName 2.7.6 bulunamadı."
            exit 1
          }

          echo "Sürüm kontrolü başarılı."

      - name: Supabase yapılandırmasını kontrol et
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("app/src/main/assets/config.json")

          if not p.is_file():
              raise SystemExit("HATA: config.json dosyası bulunamadı.")

          cfg = json.loads(p.read_text(encoding="utf-8"))

          required = ["supabaseUrl", "supabaseAnonKey", "redirectUri"]
          missing = [k for k in required if not cfg.get(k)]

          if missing:
              raise SystemExit(
                  "HATA: config.json alanları eksik: "
                  + ", ".join(missing)
              )

          print("Yapılandırma kontrolü başarılı.")
          PY

      - name: İmzalama anahtarını hazırla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_B64:-}" || {
            echo "HATA: ANDROID_KEYSTORE_BASE64 secret eksik."
            exit 1
          }

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$GITHUB_WORKSPACE/olcudefteri-release.jks"

          test -s "$GITHUB_WORKSPACE/olcudefteri-release.jks"

      - name: İmzalama bilgilerini kontrol et
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${STORE_PASSWORD:-}" || {
            echo "HATA: ANDROID_KEYSTORE_PASSWORD secret eksik."
            exit 1
          }

          test -n "${KEY_ALIAS:-}" || {
            echo "HATA: ANDROID_KEY_ALIAS secret eksik."
            exit 1
          }

          test -n "${KEY_PASSWORD:-}" || {
            echo "HATA: ANDROID_KEY_PASSWORD secret eksik."
            exit 1
          }

      - name: Gradle sürümünü kontrol et
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version

      - name: APK ve AAB oluştur
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew --no-daemon --stacktrace \
            clean \
            assembleRelease \
            bundleRelease

      - name: Çıktıları doğrula
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK" || {
            echo "HATA: APK oluşturulamadı."
            exit 1
          }

          test -s "$AAB" || {
            echo "HATA: AAB oluşturulamadı."
            exit 1
          }

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK ve AAB oluşturuldu."
          ls -lh "$APK" "$AAB"

      - name: APK ve AAB dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.7.6-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
