name: Ölçü Defteri APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Projeyi çıkart
        run: |
        
          ZIP="./OlcuDefteri-Pro-v2.3.5-FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP bulunamadı"
            find . -type f -name "*.zip"
            exit 1
          fi

          echo "ZIP bulundu: $ZIP"
          unzip -q -o "$ZIP" -d .

      - name: Supabase ayarlarını ekle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || exit 1
          test -n "$SUPABASE_PUBLISHABLE_KEY" || exit 1

          python3 - <<'PY'
          import json, os

          p="app/src/main/assets/config.json"
          d=json.load(open(p,encoding="utf-8"))

          d["supabaseUrl"]=os.environ["SUPABASE_URL"]
          d["supabaseAnonKey"]=os.environ["SUPABASE_PUBLISHABLE_KEY"]
          d["redirectUri"]="olcudefteri://auth-callback"

          json.dump(
              d,
              open(p,"w",encoding="utf-8"),
              ensure_ascii=False,
              indent=2
          )
          PY

      - name: Sürümü doğrula
        run: |
          grep -q "versionCode 38" app/build.gradle
          grep -q 'versionName "2.3.5"' app/build.gradle

      - name: Kalıcı imzalama anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || {
            echo "ANDROID_KEYSTORE_BASE64 eksik"
            exit 1
          }

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$GITHUB_WORKSPACE/olcudefteri-release.jks"

          test -s "$GITHUB_WORKSPACE/olcudefteri-release.jks"

      - name: Gradle 8.13 kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip

      - name: Release APK oluştur
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || exit 1
          test -n "$ANDROID_KEY_ALIAS" || exit 1
          test -n "$ANDROID_KEY_PASSWORD" || exit 1

          ./gradle-8.13/bin/gradle assembleRelease bundleRelease --no-daemon

      - name: AAB'yi hazırla
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.3.5-AAB
          path: app/build/outputs/bundle/release/app-release.aab  
      - name: APK'yi hazırla
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.3.5-APK
          path: app/build/outputs/apk/release/app-release.apk
