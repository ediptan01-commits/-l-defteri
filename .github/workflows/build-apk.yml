name: Olcu Defteri 2.7.16 - APK ve AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olcu-defteri-android-build
  cancel-in-progress: false

jobs:
  build:
    name: APK ve AAB derle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Kaynak ZIP'ini bul ve sürümü doğrula
        id: project_root
        shell: bash
        run: |
          set -euo pipefail

          archive="OlcuDefteri-v2.7.16-google-giris-tani.zip"
          if [[ ! -f "$GITHUB_WORKSPACE/$archive" ]]; then
            echo "HATA: $archive bulunamadı."
            echo "Depodaki 2.7.16 ZIP dosyaları:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'OlcuDefteri-v2.7.14-*.zip' -printf '%f\n'
            exit 1
          fi

          source_dir="$RUNNER_TEMP/olcu-defteri-source"
          mkdir -p "$source_dir"
          unzip -q "$GITHUB_WORKSPACE/$archive" -d "$source_dir"

          app_gradle="$(find "$source_dir" -type f -path '*/app/build.gradle' -print -quit)"

          if [[ -z "$app_gradle" ]]; then
            echo "HATA: ZIP içinde app/build.gradle bulunamadı."
            exit 1
          fi

          project_dir="${app_gradle%/app/build.gradle}"

          grep -Eq 'versionCode[[:space:]]+70' "$app_gradle" || {
            echo "HATA: versionCode 70 bulunamadı."
            grep -nE 'versionCode|versionName' "$app_gradle" || true
            exit 1
          }

          grep -Eq 'versionName[[:space:]]+"2\.7\.16"' "$app_gradle" || {
            echo "HATA: versionName 2.7.16 bulunamadı."
            grep -nE 'versionCode|versionName' "$app_gradle" || true
            exit 1
          }

          test -f "$project_dir/app/src/main/assets/config.json" || {
            echo "HATA: config.json bulunamadı."
            exit 1
          }

          python3 - "$project_dir/app/src/main/assets/config.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          cfg = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = ("supabaseUrl", "supabaseAnonKey", "redirectUri")
          missing = [key for key in required if not cfg.get(key)]
          if missing:
              raise SystemExit("config.json eksik alanlar: " + ", ".join(missing))
          print("config.json kontrolü başarılı.")
          PY

          if [[ ! -f "$project_dir/settings.gradle" && ! -f "$project_dir/settings.gradle.kts" ]]; then
            echo "HATA: settings.gradle dosyası bulunamadı."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Kaynak proje: $project_dir"
          echo "Sürüm: 2.7.16 (70)"

      - name: İmzalama anahtarını hazırla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?ANDROID_KEYSTORE_BASE64 secret eksik}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/olcudefteri-release.jks"
          test -s "$RUNNER_TEMP/olcudefteri-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/olcudefteri-release.jks" >> "$GITHUB_ENV"

      - name: Gradle 9.1.0 kur
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip \
            --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"

      - name: APK ve AAB oluştur
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret eksik}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret eksik}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret eksik}"

          gradle --version

          gradle --no-daemon --stacktrace \
            -p "$ANDROID_PROJECT_DIR" \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            clean assembleRelease bundleRelease

      - name: APK ve AAB dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.7.16-release
          path: |
            ${{ steps.project_root.outputs.project_dir }}/app/build/outputs/apk/release/app-release.apk
            ${{ steps.project_root.outputs.project_dir }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
