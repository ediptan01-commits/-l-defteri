name: Ölçü Defteri APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: 2.4.1 Offline AI projesini çıkart
        run: |
          ZIP="./OlcuDefteri-v2.5.3-BASLIK-DUZELTILDI.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP bulunamadı: $ZIP"8
            find . -type f -name "*.zip"
            exit 1
          fi

          echo "ZIP bulundu: $ZIP"
          unzip -q -o "$ZIP" -d .
          APP_BUILD=$(find . -type f -path "*/app/build.gradle" | head -n 1)

          if [ -z "$APP_BUILD" ]; then
            echo "app/build.gradle bulunamadı"
            find . -type f -name "build.gradle"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$(dirname "$APP_BUILD")")
          echo "PROJE KÖKÜ: $PROJECT_ROOT"

          if [ "$PROJECT_ROOT" != "." ]; then
            cp -a "$PROJECT_ROOT"/. .
          fi

          echo "Proje yapısı hazır:"
          ls -la
          ls -la app/src/main/assets
      - name: Supabase ayarlarını ekle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || exit 1
          test -n "$SUPABASE_PUBLISHABLE_KEY" || exit 1

          python3 - <<'PY'
          import json
          import os

          p = "app/src/main/assets/config.json"
          d = json.load(open(p, encoding="utf-8"))

          d["supabaseUrl"] = os.environ["SUPABASE_URL"]
          d["supabaseAnonKey"] = os.environ["SUPABASE_PUBLISHABLE_KEY"]
          d["redirectUri"] = "olcudefteri://auth-callback"

          json.dump(
              d,
              open(p, "w", encoding="utf-8"),
              ensure_ascii=False,
              indent=2
          )
          PY
      - name: Proje ve sürümü doğrula
        run: |
          echo "=== BUILD.GRADLE DOSYALARI ==="
          find . -type f -name "build.gradle" -print

          echo "=== VERSION BİLGİLERİ ==="
          find . -type f -name "build.gradle" -exec grep -Hn "versionCode\|versionName" {} \;

          BUILD_FILE=$(find . -type f -path "*/app/build.gradle" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "app/build.gradle bulunamadı"
            exit 1
          fi

          echo "KONTROL EDİLEN DOSYA: $BUILD_FILE"

          grep -q "versionCode 49" "$BUILD_FILE" || {
            echo "HATA: versionCode 49 bulunamadı"
            exit 1
          }

          grep -q 'versionName "2.5.3"' "$BUILD_FILE" || {
            echo "HATA: versionName 2.5.3 bulunamadı"
            exit 1
          }

          echo "Sürüm 2.5.3 / versionCode 49 doğrulandı."
      - name: Kalıcı olarak uygulanması anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || {
            echo "ANDROID_KEYSTORE_BASE64 eksik"
            exit 1
          }

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$GITHUB_WORKSPACE/olcudefteri-release.jks"

          test -s "$GITHUB_WORKSPACE/olcudefteri-release.jks"

      - name: Gradle 8.13 kursu
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip

      - name: APK ve AAB sürümlerini oluştur
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || exit 1
          test -n "$ANDROID_KEY_ALIAS" || exit 1
          test -n "$ANDROID_KEY_PASSWORD" || exit 1

          ./gradle-8.13/bin/gradle assembleRelease bundleRelease --no-daemon

      - name: APK ve AAB'yi hazırla
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.5.3-COKME-KORUMALI
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Kaynak projeyi yükle
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.5.3-KAYNAK-PROJE
          path: |
            app/
            gradle/
            build.gradle
            settings.gradle
            gradle.properties
            gradlew
            gradlew.bat
