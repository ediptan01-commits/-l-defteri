name: Olcu Defteri 2.7.6 - APK ve AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olcu-defteri-android-build
  cancel-in-progress: false

jobs:
  build:
    name: APK ve AAB derle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android lisanslarını kabul et ve SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sürüm ve yapılandırmayı doğrula
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 60' app/build.gradle || { echo 'HATA: versionCode 60 bulunamadı.'; exit 1; }
          grep -Fq 'versionName "2.7.6"' app/build.gradle || { echo 'HATA: versionName 2.7.6 bulunamadı.'; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('app/src/main/assets/config.json')
          cfg = json.loads(p.read_text(encoding='utf-8'))
          required = ('supabaseUrl', 'supabaseAnonKey', 'redirectUri')
          missing = [key for key in required if not cfg.get(key)]
          if missing:
              raise SystemExit('config.json eksik alanlar: ' + ', '.join(missing))
          PY

      - name: İmzalama anahtarını hazırla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64:-}" ]]; then
            echo 'HATA: ANDROID_KEYSTORE_BASE64 GitHub Actions secret tanımlı değil.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/olcudefteri-release.jks"
          test -s "$GITHUB_WORKSPACE/olcudefteri-release.jks"

      - name: Gradle 9.1.0 kur
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip \
            --output "$RUNNER_TEMP/gradle-9.1.0-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-9.1.0-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"

      - name: APK ve AAB oluştur
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret eksik}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret eksik}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret eksik}"
          gradle --version
          gradle --no-daemon --stacktrace clean assembleRelease bundleRelease

      - name: APK ve AAB dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.7.6-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
