name: Olcu Defteri 2.7.6 - APK ve AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olcu-defteri-android-build
  cancel-in-progress: false

jobs:
  build:
    name: APK ve AAB derle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android lisanslarını ve SDK paketlerini hazırla
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Sürüm ve proje dosyalarını doğrula
        shell: bash
        run: |
          set -euo pipefail

          test -f build.gradle
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/config.json

          grep -Eq "versionCode[[:space:]]+60" app/build.gradle
          grep -Eq 'versionName[[:space:]]+"2\.7\.6"' app/build.gradle

          echo "Sürüm kontrolü:"
          grep -E 'versionCode|versionName' app/build.gradle

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app/src/main/assets/config.json")
          config = json.loads(path.read_text(encoding="utf-8"))

          required = (
              "supabaseUrl",
              "supabaseAnonKey",
              "redirectUri",
          )

          missing = [
              key for key in required
              if not isinstance(config.get(key), str)
              or not config[key].strip()
          ]

          if missing:
              raise SystemExit(
                  "config.json alanları eksik: "
                  + ", ".join(missing)
              )

          print("config.json kontrolü başarılı.")
          PY

      - name: İmzalama Secrets bilgilerini kontrol et
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_B64:-}" || {
            echo "ANDROID_KEYSTORE_BASE64 tanımlı değil."
            exit 1
          }

          test -n "${KEYSTORE_PASSWORD:-}" || {
            echo "ANDROID_KEYSTORE_PASSWORD tanımlı değil."
            exit 1
          }

          test -n "${KEY_ALIAS:-}" || {
            echo "ANDROID_KEY_ALIAS tanımlı değil."
            exit 1
          }

          test -n "${KEY_PASSWORD:-}" || {
            echo "ANDROID_KEY_PASSWORD tanımlı değil."
            exit 1
          }

      - name: İmzalama anahtarını hazırla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$GITHUB_WORKSPACE/olcudefteri-release.jks"

          test -s "$GITHUB_WORKSPACE/olcudefteri-release.jks"

      - name: Gradle 9.1.0 kur
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip \
            --output "$RUNNER_TEMP/gradle-9.1.0-bin.zip"

          unzip -q "$RUNNER_TEMP/gradle-9.1.0-bin.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"

      - name: Gradle ve Android yapılandırmasını kontrol et
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle --version

          gradle --no-daemon --stacktrace tasks --all

      - name: APK ve AAB oluştur
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            clean \
            assembleRelease \
            bundleRelease

      - name: Üretilen dosyaları ve APK imzasını doğrula
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          echo "APK ve AAB dosyaları oluşturuldu."
          ls -lh "$APK" "$AAB"

      - name: APK ve AAB dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.7.6-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
