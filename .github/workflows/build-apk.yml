name: Olcu Defteri APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android 36 kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Projeyi çıkart
        run: |
          mkdir -p project
          unzip -q OlcuDefteri-Pro-FINAL-v5-UI-PDF-FIX.zip -d project

      - name: Gradle projesini bul ve APK oluştur
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f -print -quit | xargs dirname)
          echo "Gradle projesi: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: APK'yı hazırla
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-APK-FINAL
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
