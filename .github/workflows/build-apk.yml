
name: Ölçü Defteri 2.7.2 - APK ve AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 2.7.2 kaynak projesini çıkart
        run: |
          ZIP="./OlcuDefteri-v2.7.2-FUGA-SOVE-KAT-SILMESI.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP bulunamadı: $ZIP"
            ls -la
            exit 1
          fi

          unzip -q -o "$ZIP" -d .

          test -f app/build.gradle || {
            echo "app/build.gradle bulunamadı"
            find . -name build.gradle
            exit 1
          }

          test -f app/src/main/assets/config.json || {
            echo "config.json bulunamadı"
            exit 1
          }

          echo "Kaynak proje hazır."

      - name: Supabase ayarlarını ekle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || {
            echo "SUPABASE_URL eksik"
            exit 1
          }

          test -n "$SUPABASE_PUBLISHABLE_KEY" || {
            echo "SUPABASE_PUBLISHABLE_KEY eksik"
            exit 1
          }

          python3 - <<'PY'
          import json
          import os

          p = "app/src/main/assets/config.json"

          with open(p, encoding="utf-8") as f:
              data = json.load(f)

          data["supabaseUrl"] = os.environ["SUPABASE_URL"]
          data["supabaseAnonKey"] = os.environ["SUPABASE_PUBLISHABLE_KEY"]
          data["redirectUri"] = "olcudefteri://auth-callback"

          with open(p, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Sürümü doğrula
        run: |
          grep -q "versionCode 56" app/build.gradle || {
            echo "HATA: versionCode 56 bulunamadı"
            exit 1
          }

          grep -q 'versionName "2.7.2"' app/build.gradle || {
            echo "HATA: versionName 2.7.2 bulunamadı"
            exit 1
          }

          echo "Sürüm 2.7.2 doğrulandı."

      - name: İmzalama anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || {
            echo "ANDROID_KEYSTORE_BASE64 eksik"
            exit 1
          }

          printf '%s' "$KEYSTORE_B64" | base64 --decode \
            > "$GITHUB_WORKSPACE/olcudefteri-release.jks"

          test -s "$GITHUB_WORKSPACE/olcudefteri-release.jks" || {
            echo "İmzalama anahtarı oluşturulamadı"
            exit 1
          }

      - name: Gradle 8.13 kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip

      - name: APK ve AAB oluştur
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || exit 1
          test -n "$ANDROID_KEY_ALIAS" || exit 1
          test -n "$ANDROID_KEY_PASSWORD" || exit 1

          ./gradle-8.13/bin/gradle assembleRelease bundleRelease --no-daemon

      - name: APK dosyasını yayımla
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.7.2-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: AAB dosyasını yayımla
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.7.2-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
