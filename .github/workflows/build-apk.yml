name: Olcu Defteri 2.7.6 - APK ve AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olcu-defteri-android-build
  cancel-in-progress: false

jobs:
  build:
    name: APK ve AAB derle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_PROJECT_DIR: extracted

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
            echo "HATA: sdkmanager bulunamadı. SDK kökü: $sdk_root"
            find "$sdk_root" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          "$sdkmanager" --sdk_root="$sdk_root" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Proje yolunu ve sürümü doğrula
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$GITHUB_WORKSPACE/$ANDROID_PROJECT_DIR"
          test -f "$project_dir/settings.gradle" || { echo "HATA: $project_dir/settings.gradle bulunamadı."; exit 1; }
          test -f "$project_dir/app/build.gradle" || { echo "HATA: $project_dir/app/build.gradle bulunamadı."; exit 1; }
          grep -Eq 'versionCode[[:space:]]+61' "$project_dir/app/build.gradle" || { echo 'HATA: versionCode 61 bulunamadı.'; exit 1; }
          grep -Eq 'versionName[[:space:]]+"2\.7\.6"' "$project_dir/app/build.gradle" || { echo 'HATA: versionName 2.7.6 bulunamadı.'; exit 1; }
          python3 - "$project_dir/app/src/main/assets/config.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          cfg = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          required = ('supabaseUrl', 'supabaseAnonKey', 'redirectUri')
          missing = [key for key in required if not cfg.get(key)]
          if missing:
              raise SystemExit('config.json eksik alanlar: ' + ', '.join(missing))
          PY

      - name: İmzalama anahtarını hazırla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?ANDROID_KEYSTORE_BASE64 GitHub Actions secret eksik}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/olcudefteri-release.jks"
          test -s "$GITHUB_WORKSPACE/olcudefteri-release.jks"

      - name: Gradle 9.1.0 kur
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip \
            --output "$RUNNER_TEMP/gradle-9.1.0-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-9.1.0-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"

      - name: APK ve AAB oluştur
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret eksik}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret eksik}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret eksik}"
          gradle --version
          gradle --no-daemon --stacktrace -p "$GITHUB_WORKSPACE/$ANDROID_PROJECT_DIR" clean assembleRelease bundleRelease

      - name: APK ve AAB dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.7.6-release
          path: |
            extracted/app/build/outputs/apk/release/app-release.apk
            extracted/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14


