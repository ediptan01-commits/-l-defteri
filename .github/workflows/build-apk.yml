name: Olcu Defteri 2.7.6 - APK ve AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olcu-defteri-android-build
  cancel-in-progress: false

jobs:
  build:
    name: APK ve AAB derle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK kur
        uses: android-actions/setup-android@v4
      - name: Android SDK paketlerini kur
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: ZIP içinden kaynak projeyi bul
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$GITHUB_WORKSPACE"
          if [[ ! -f "$project_dir/app/build.gradle" ]]; then
            archive="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'OlcuDefteri-v2.7.6-ACIL-COKME-DUZELTME.zip' -print -quit)"
            if [[ -z "$archive" ]]; then
              echo 'HATA: Proje kökünde app/build.gradle yok ve kaynak ZIP bulunamadı.'
              exit 1
            fi
            extract_dir="$RUNNER_TEMP/olcudefteri-source"
            mkdir -p "$extract_dir"
            unzip -q "$archive" -d "$extract_dir"
            project_gradle="$(find "$extract_dir" -type f -path '*/app/build.gradle' -print -quit)"
            if [[ -z "$project_gradle" ]]; then
              echo "HATA: ZIP içinde app/build.gradle bulunamadı: $archive"
              exit 1
            fi
            project_dir="${project_gradle%/app/build.gradle}"
          fi
          grep -Eq 'versionCode[[:space:]]+61' "$project_dir/app/build.gradle" || { echo 'HATA: versionCode 61 bulunamadı.'; exit 1; }
          grep -Eq 'versionName[[:space:]]+"2\.7\.6"' "$project_dir/app/build.gradle" || { echo 'HATA: versionName 2.7.6 bulunamadı.'; exit 1; }
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
      - name: İmzalama anahtarını hazırla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64:-}" ]]; then echo 'HATA: ANDROID_KEYSTORE_BASE64 secret tanımlı değil.'; exit 1; fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/olcudefteri-release.jks"
          test -s "$GITHUB_WORKSPACE/olcudefteri-release.jks"
      - name: Gradle 8.13 kur
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 https://services.gradle.org/distributions/gradle-8.13-bin.zip --output "$RUNNER_TEMP/gradle-8.13-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: APK ve AAB oluştur
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret eksik}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret eksik}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret eksik}"
          gradle --no-daemon --stacktrace -p "${{ steps.project.outputs.project_dir }}" clean assembleRelease bundleRelease
      - name: APK ve AAB dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OlcuDefteri-v2.7.6-release
          path: |
            **/build/outputs/apk/release/app-release.apk
            **/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
